name: Wiki Lint

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify script compiles
        run: python -m py_compile scripts/wiki_index.py

      - name: Run wiki lint
        run: python scripts/wiki_index.py --lint
